name: NIST FIPS 140-2
description: 'Security requirements for cryptographic modules, defining four increasing, qualitative security
  levels for a wide range of applications and environments. It covers cryptographic module specification;
  ports and interfaces; roles, services, and authentication; finite state model; physical security; operational
  environment; cryptographic key management; electromagnetic interference/electromagnetic compatibility
  (EMI/EMC); self-tests; design assurance; and mitigation of other attacks. Superseded by FIPS 140-3 in
  2019. Under the CMVP transition, FIPS 140-2 validations moved to the historical list on September 21,
  2026: modules on that list may still be purchased and used in existing systems, but should not be selected
  for new ones.'
