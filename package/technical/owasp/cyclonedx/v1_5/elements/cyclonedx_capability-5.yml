id: d6950c73-b97e-40c2-bd28-e14e1d103bbd
name: Bill of Vulnerabilities (BOV)
description: Bill of Vulnerabilities (BOV) is a standardized way to exchange vulnerability
  information between systems, enabling organizations to share complex vulnerability
  data effectively. By focusing on a machine-readable format, BOV simplifies the communication
  of vulnerability metadata such as severities, risk ratings, and remediation details.
  Fully compatible with CycloneDX BOMs for holistic supply chain risk management.
  A BOV provides granular, machine-readable data, while a VDR is the formal, human-readable
  report derived from that data. BOVs catalogue everything found; VDRs report on what's
  relevant and addressed for customers. BOV is for systems and automation; VDR is
  for customers, partners, and internal teams.
