id: 93c778b8-4766-405b-a9c2-4c741e7b7376
name: Vulnerability Disclosure Report (VDR)
description: Support for Vulnerability Disclosure Report (VDR) to facilitate vulnerability
  disclosure across different parties, such as in bug bounty programs or coordinated
  disclosure efforts with external researchers. Internally, VDRs can streamline vulnerability
  management by optimizing remediation efforts and enabling clear communication between
  security, development, and operations teams. This capability aligns with international
  standards such as ISO/IEC 29147:2018. VDRs are also known as Vulnerability Advisory
  Reports (VAR).
elementType: cyclonedx_capability
