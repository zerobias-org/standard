name: Software as a Service Bill of Materials (SaaSBOM)
description: Software as a Service Bill of Materials (SaaSBOM) provides a standardized
  way to represent critical details about cloud-native systems. Represents endpoints,
  data flows, and dependencies within cloud-native services; aligns with Infrastructure-as-Code
  and microservices architectures; captures data classification and directional flow
  between services; identifies risks such as misconfigurations and insecure APIs.
