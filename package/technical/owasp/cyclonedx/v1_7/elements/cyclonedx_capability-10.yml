name: Operations Bill of Materials (OBOM)
description: Operations Bill of Materials (OBOM) provides a structured way to represent
  the runtime environment of applications. Captures configurations, runtime environments,
  and dependencies in production systems; provides insights into staging, deployment,
  and operational states; bridges the gap between development and operations teams;
  supports risk assessments for live and evolving systems.
