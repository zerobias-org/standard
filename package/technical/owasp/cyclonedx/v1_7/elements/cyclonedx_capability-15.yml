name: CycloneDX Attestations (CDXA)
description: CycloneDX Attestations (CDXA) are a modern capability for security compliance.
  They enable organizations to communicate standards, claims, and evidence in support
  of requirements, along with attestations to the veracity and completeness of those
  claims. CDXA makes compliance as code possible with machine-readable security standards
  and compliance documentation, instead of endless PDFs, spreadsheets, and paper evidence.
